spring:
  application:
    name: healthgame-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthgame}
    username: ${DB_USERNAME:healthgame}
    password: ${DB_PASSWORD:healthgame}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events
              - https://www.googleapis.com/auth/calendar.readonly
app:
  security:
    jwt:
      issuer: healthgame
      access-token-expiration: PT15M
      refresh-token-expiration: P14D
      secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-change-this-dev-secret}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
