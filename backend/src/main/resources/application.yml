spring:
  application:
    name: healthgame-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthgame}
    username: ${DB_USERNAME:healthgame}
    password: ${DB_PASSWORD:healthgame}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
app:
  security:
    jwt:
      issuer: healthgame
      access-token-expiration: PT15M
      refresh-token-expiration: P14D
      secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-change-this-dev-secret}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui